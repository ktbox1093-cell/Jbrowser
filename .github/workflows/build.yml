       name: Compilar
        working-directory: client
        run: |
          mkdir -p build/classes
          javac -source 1.4 -target 1.4 -bootclasspath ../tools/cldc.jar:../tools/midp.jar:$JAVA_HOME/jre/lib/rt.jar -d build/classes src/JBrowser.java
          jar cfm build/in.jar manifest.mf -C build/classes .
      - name: Preverificar con ProGuard
        working-directory: client
        run: |
          printf '%s\n' \
            '-injars build/in.jar' \
            '-outjars JBrowser.jar' \
            '-libraryjars ../tools/cldc.jar' \
            '-libraryjars ../tools/midp.jar' \
            "-libraryjars $JAVA_HOME/jre/lib/rt.jar" \
            '-microedition' '-dontobfuscate' '-dontoptimize' '-dontshrink' \
            '-dontnote' '-dontwarn' '-keep public class JBrowser' > build/pg.conf
          sh ../tools/proguard-7.4.2/bin/proguard.sh @build/pg.conf
          SIZE=$(wc -c < JBrowser.jar)
          sed -i "s/^MIDlet-Jar-Size:.*/MIDlet-Jar-Size: $SIZE/" JBrowser.jad
          ls -l JBrowser.jar JBrowser.jad
